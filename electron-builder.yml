# Windows x64 release: NSIS installer + portable ZIP.
appId: com.badj0ey.subclip
productName: SubClip
copyright: Copyright © 2026 Badj0ey
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # Transformers.js uses the Windows Node runtime, not other platform binaries.
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!**/node_modules/onnxruntime-web/dist/**'

# The Settings view reads the userscript from a real resource directory.
extraResources:
  - from: userscript
    to: userscript
    filter:
      - '**/*'
  # 内置 ffmpeg（本地切片开箱可用）。构建前由 npm run vendor:ffmpeg 下载并校验，
  # 放在 asar 外，主进程按 resources/ffmpeg/ffmpeg.exe 查找。
  - from: vendor/ffmpeg
    to: ffmpeg
    filter:
      - '**/*'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 字幕剪
  # 控制面板里的卸载项名称，保留中文产品名，版本号由构建时展开。
  uninstallDisplayName: 字幕剪 SubClip ${version}
  # 安装向导显示 MIT 许可证；升级/卸载默认保留用户数据库与设置。
  license: LICENSE
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: ${productName}-${version}-setup.${ext}
