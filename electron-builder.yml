# electron-builder 打包配置
# 打包：npm run dist（安装包 + 免安装版） / npm run dist:dir（只解包，便于快速验证）

appId: com.badj0ey.subclip
productName: SubClip
copyright: Copyright © 2026 Badj0ey
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

# 只把构建产物与清单打进 asar。
# src/ 与 tests/ 不需要随程序分发（早期配置缺失时它们会被一起打包进 asar）。
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # ---------------------------------------------------------------------------
  # 瘦身（2.3.0）：依赖树里有三块与「Windows 桌面运行」无关的大文件
  #
  # 1. onnxruntime-node 自带三平台原生库：darwin 85.3MB + linux 68.4MB + win32 133.3MB。
  #    本项目只出 Windows 包（win.target 只有 nsis/zip x64），另两个平台纯属浪费。
  #    **注意：onnxruntime-node 本身不能去掉** —— transformers v4 的 Node 构建在 import
  #    阶段就 require 它，移走会直接报 `Cannot find module 'onnxruntime-node'`（已实测）。
  # 2. onnxruntime-web 的 dist 有 135MB 的 WASM 变体，我们走的是 Node 绑定，用不到。
  #
  # 实测收益：736.9MB → 449.7MB（省 287MB）。
  #
  # ⚠️ **不要**顺手把 @img/sharp 也排掉：transformers 启动时会 require 它，
  # 排掉后语义检索直接报 `Could not load the "sharp" module`（已实测，省 19MB 换掉功能）。
  # ---------------------------------------------------------------------------
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!**/node_modules/onnxruntime-web/dist/**'

# 用户脚本必须放在 asar 之外的真实目录里：
# 主进程用 process.resourcesPath/userscript 去找它，设置页会读取内容供用户复制。
# 少了这一段，打包后的应用会报「用户脚本不存在」。
extraResources:
  - from: userscript
    to: userscript
    filter:
      - '**/*'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 字幕剪
  artifactName: ${productName}-${version}-setup.${ext}
