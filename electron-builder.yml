# Windows x64 release: NSIS installer + portable ZIP.
appId: com.badj0ey.subclip
productName: SubClip
copyright: Copyright © 2026 Badj0ey
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # Transformers.js uses the Windows Node runtime, not other platform binaries.
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!**/node_modules/onnxruntime-web/dist/**'

# The Settings view reads the userscript from a real resource directory.
extraResources:
  - from: userscript
    to: userscript
    filter:
      - '**/*'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 字幕剪
  artifactName: ${productName}-${version}-setup.${ext}
