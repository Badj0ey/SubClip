<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>SRT 字幕助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <strong id="statusText">正在检测…</strong>
      <span class="spacer"></span>
      <button id="btnReconnect" class="ghost" title="重新连接">⟳</button>
    </header>

    <section class="card">
      <div class="row">
        <label>本地端口</label>
        <input id="port" type="number" min="1" max="65535" />
        <button id="btnSavePort" class="ghost">保存</button>
      </div>
      <div class="row" style="margin-top: 6px">
        <label>配对令牌</label>
        <input id="token" type="text" placeholder="留空即可" spellcheck="false" />
        <button id="btnSaveToken" class="ghost">保存</button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="hint">
        桌面端「设置 → 浏览器插件通信」里如果填了令牌，这里要填一样的值；留空则只做来源校验。
      </div>
    </section>

    <section class="card">
      <div class="row">
        <span class="label" style="margin: 0">浏览器登录状态</span>
        <span class="spacer"></span>
        <span class="pill" id="loginState">检测中…</span>
      </div>
      <div class="row" style="margin-top: 6px">
        <span class="label" style="margin: 0">桌面端登录状态</span>
        <span class="spacer"></span>
        <span class="pill" id="cookieState">未知</span>
      </div>
      <button id="btnSyncCookies" class="primary block">同步登录状态到桌面端</button>
    </section>

    <section class="card">
      <div class="label">当前页面（自动识别，不自动同步）</div>
      <div id="pageInfo" class="value">未识别</div>
    </section>

    <section class="card">
      <div class="label">字幕轨</div>
      <div id="tracks" class="value">—</div>
    </section>

    <section class="actions">
      <button id="btnSync" class="primary">同步该视频到桌面端</button>
      <button id="btnFetch" class="ghost">让桌面端拉取全部分P</button>
    </section>

    <section class="note">
      第二个按钮会把该视频<strong>所有分P</strong>的字幕都拉到桌面端 ——
      桌面端需要已有登录状态（用上面的「同步登录状态」同步一次即可）。
    </section>

    <section class="card">
      <div class="label">最近事件</div>
      <ul id="events" class="events"></ul>
    </section>

    <script src="popup.js" type="module"></script>
  </body>
</html>
