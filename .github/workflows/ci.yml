name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同分支重复推送时取消上一次未跑完的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 类型检查 + 测试 + 构建
    # 用 Windows runner：test:smoke / test:bridge 要真的启动 Electron 主进程并创建窗口，
    # Linux runner 上还得额外挂 xvfb，不如直接用 Windows 贴近实际发布环境。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 运行全部测试
        run: npm test

  package:
    name: 打包 Windows 安装包
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 打包（安装包 + 免安装 zip）
        run: npm run dist
        env:
          # 未配置代码签名证书时跳过签名（自签会让 SmartScreen 报警，不如不签）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
