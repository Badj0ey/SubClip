name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# 标签发布走手工流程（见 docs/GITHUB.md），推送 v* 标签不再触发 CI：
# 避免 electron-builder 在标签环境里尝试自动发布，导致缺少 GH_TOKEN 的失败。

permissions:
  contents: read

# 同分支重复推送时取消上一次未跑完的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 类型检查 + 测试 + 构建
    # 用 Windows runner：test:smoke / test:bridge 要真的启动 Electron 主进程并创建窗口，
    # Linux runner 上还得额外挂 xvfb，不如直接用 Windows 贴近实际发布环境。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 运行全部测试
        run: npm test

  package:
    name: 打包 Windows 安装包（仅手动触发）
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 打包（安装包 + 免安装 zip）
        run: npm run dist
        env:
          # 未配置代码签名证书时跳过签名（自签会让 SmartScreen 报警，不如不签）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 生成 SHA-256 校验文件
        run: npm run dist:checksums

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # 只有推送 v* 标签才创建 Release；手动触发只产出 Actions artifact，方便先验收。
      - name: 创建草稿 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SubClip ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
